<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thẻ hiển thị hình ảnh trong HTML</title>
</head>
<body>

    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- Cách 1: Sử dụng đường dẫn hình ảnh online (URL) -->
    <h2>1. Ảnh từ đường dẫn trực tuyến:</h2>
    <img src="https://picsum.photos/400/250" alt="Một bức ảnh phong cảnh ngẫu nhiên chất lượng cao">

    <!-- Cách 2: Sử dụng file ảnh lưu local trong cùng thư mục -->
    <h2>2. Ảnh từ thư mục dự án:</h2>
    <img src="my-photo.jpg" alt="Bức ảnh đại diện cá nhân của tôi">

</body>
</html>
